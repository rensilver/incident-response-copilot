name: incident-copilot

services:
  prometheus:
    image: prom/prometheus:v3.13.5
    container_name: ic-prometheus
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/data:/prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    container_name: ic-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  grafana:
    image: grafana/grafana:13.2.4
    container_name: ic-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ic-app
    env_file: .env
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - GRAFANA_URL=http://grafana:3000
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      prometheus:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        INCIDENT_COPILOT_BACKEND_ORIGIN: http://app:8000
    container_name: ic-frontend
    ports:
      - "3001:3001"
    depends_on:
      - app
