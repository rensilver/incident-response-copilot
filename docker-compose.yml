name: incident-copilot

services:
  prometheus:
    image: prom/prometheus:v3.13.5
    container_name: ic-prometheus
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    container_name: ic-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=3s"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  grafana:
    image: grafana/grafana:13.2.4
    container_name: ic-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ic-app
    env_file: .env
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - GRAFANA_URL=http://grafana:3000
    ports:
      - "8000:8000"
    # Allow the 240-second graph deadline and Uvicorn cleanup before Docker kills it.
    stop_grace_period: 260s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      elasticsearch:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        INCIDENT_COPILOT_BACKEND_ORIGIN: http://app:8000
    container_name: ic-frontend
    ports:
      - "3001:3001"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
